<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Onboarding Schedule</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }

    .container {
      max-width: 1000px;
      margin: 30px auto;
      padding: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 32px;
    }

    .header p {
      margin: 0;
      color: #6b7280;
    }

    .calendar-box {
      background: white;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    }

    .calendar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .calendar-header h2 {
      margin: 0;
      font-size: 24px;
    }

    button {
      border: none;
      background: #2563eb;
      color: white;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover {
      background: #1d4ed8;
    }

    .weekdays,
    .days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .weekday {
      text-align: center;
      font-weight: bold;
      color: #6b7280;
      padding: 10px 2px;
      font-size: 13px;
    }

    .day {
      min-height: 85px;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 8px;
      background: #fff;
      position: relative;
    }

    .day-number {
      font-weight: bold;
      margin-bottom: 6px;
    }

    .available {
      cursor: pointer;
      background: #eff6ff;
      border-color: #93c5fd;
    }

    .available:hover {
      background: #dbeafe;
    }

    .unavailable {
      background: #f9fafb;
      color: #9ca3af;
    }

    .today {
      border: 2px solid #2563eb;
    }

    .availability-label {
      font-size: 11px;
      color: #2563eb;
      font-weight: bold;
    }

    .time-panel {
      display: none;
      margin-top: 25px;
      padding: 20px;
      border-radius: 12px;
      background: #f8fafc;
      border: 1px solid #e5e7eb;
    }

    .time-panel h3 {
      margin-top: 0;
    }

    .selected-date {
      color: #2563eb;
    }

    .times {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px;
      margin-top: 15px;
    }

    .time-button {
      background: white;
      color: #2563eb;
      border: 1px solid #93c5fd;
    }

    .time-button:hover {
      background: #2563eb;
      color: white;
    }

    .note {
      margin-top: 20px;
      text-align: center;
      color: #6b7280;
      font-size: 13px;
    }

    @media (max-width: 700px) {
      .container {
        padding: 10px;
        margin: 10px auto;
      }

      .calendar-box {
        padding: 12px;
      }

      .calendar-header h2 {
        font-size: 19px;
      }

      .day {
        min-height: 65px;
        padding: 5px;
      }

      .availability-label {
        font-size: 9px;
      }

      .weekday {
        font-size: 11px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <h1>Onboarding Schedule</h1>
      <p>Select an available date and time for your onboarding.</p>
    </div>

    <div class="calendar-box">

      <div class="calendar-header">
        <button onclick="previousMonth()">‹ Previous</button>
        <h2 id="monthYear"></h2>
        <button onclick="nextMonth()">Next ›</button>
      </div>

      <div class="weekdays">
        <div class="weekday">Sun</div>
        <div class="weekday">Mon</div>
        <div class="weekday">Tue</div>
        <div class="weekday">Wed</div>
        <div class="weekday">Thu</div>
        <div class="weekday">Fri</div>
        <div class="weekday">Sat</div>
      </div>

      <div class="days" id="calendarDays"></div>

      <div class="time-panel" id="timePanel">
        <h3>
          Available Times for
          <span class="selected-date" id="selectedDate"></span>
        </h3>

        <p>Available hours: <strong>8:00 AM – 5:00 PM</strong></p>

        <div class="times" id="times"></div>
      </div>

      <div class="note">
        Monday–Friday • 8:00 AM–5:00 PM
      </div>

    </div>
  </div>

  <script>

    // YOUR GOOGLE CALENDAR BOOKING LINK
    const bookingLink = "https://calendar.app.google/oTzwz2eRAX";

    // Current displayed month
    let currentDate = new Date();

    // Generate time slots
    function generateTimes() {

      const times = [];

      for (let hour = 8; hour < 17; hour++) {

        let hour12 = hour;

        let period = "AM";

        if (hour >= 12) {
          period = "PM";

          if (hour > 12) {
            hour12 = hour - 12;
          }
        }

        times.push(`${hour12}:00 ${period}`);
        times.push(`${hour12}:30 ${period}`);
      }

      // Add 5:00 PM
      times.push("5:00 PM");

      return times;
    }

    // Display calendar
    function renderCalendar() {

      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      const monthNames = [
        "January",
        "February",
        "March",
        "April",
        "May",
        "June",
        "July",
        "August",
        "September",
        "October",
        "November",
        "December"
      ];

      document.getElementById("monthYear").textContent =
        `${monthNames[month]} ${year}`;

      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      const calendarDays = document.getElementById("calendarDays");

      calendarDays.innerHTML = "";

      // Empty spaces before first day
      for (let i = 0; i < firstDay; i++) {

        const emptyDay = document.createElement("div");

        emptyDay.className = "day";

        emptyDay.style.visibility = "hidden";

        calendarDays.appendChild(emptyDay);
      }

      const today = new Date();

      // Days
      for (let day = 1; day <= daysInMonth; day++) {

        const date = new Date(year, month, day);

        const dayOfWeek = date.getDay();

        const dayElement = document.createElement("div");

        dayElement.className = "day";

        const number = document.createElement("div");

        number.className = "day-number";

        number.textContent = day;

        dayElement.appendChild(number);

        // Check if today
        if (
          date.getDate() === today.getDate() &&
          date.getMonth() === today.getMonth() &&
          date.getFullYear() === today.getFullYear()
        ) {
          dayElement.classList.add("today");
        }

        // Monday-Friday
        if (dayOfWeek >= 1 && dayOfWeek <= 5) {

          dayElement.classList.add("available");

          const label = document.createElement("div");

          label.className = "availability-label";

          label.textContent = "8 AM–5 PM";

          dayElement.appendChild(label);

          dayElement.onclick = function() {

            showTimes(date);

          };

        } else {

          dayElement.classList.add("unavailable");

          const label = document.createElement("div");

          label.className = "availability-label";

          label.style.color = "#9ca3af";

          label.textContent = "Unavailable";

          dayElement.appendChild(label);
        }

        calendarDays.appendChild(dayElement);
      }
    }

    // Show available times
    function showTimes(date) {

      const panel = document.getElementById("timePanel");

      const selectedDate = document.getElementById("selectedDate");

      const timesContainer = document.getElementById("times");

      const formattedDate = date.toLocaleDateString(
        "en-US",
        {
          weekday: "long",
          month: "long",
          day: "numeric",
          year: "numeric"
        }
      );

      selectedDate.textContent = formattedDate;

      timesContainer.innerHTML = "";

      const times = generateTimes();

      times.forEach(function(time) {

        const button = document.createElement("button");

        button.className = "time-button";

        button.textContent = time;

        button.onclick = function() {

          /*
            Google Calendar's booking page controls
            the actual appointment availability.

            Clicking a time opens your booking page.
          */

          window.open(bookingLink, "_blank");

        };

        timesContainer.appendChild(button);

      });

      panel.style.display = "block";

      panel.scrollIntoView({
        behavior: "smooth",
        block: "nearest"
      });
    }

    // Previous month
    function previousMonth() {

      currentDate.setMonth(currentDate.getMonth() - 1);

      renderCalendar();

      document.getElementById("timePanel").style.display = "none";
    }

    // Next month
    function nextMonth() {

      currentDate.setMonth(currentDate.getMonth() + 1);

      renderCalendar();

      document.getElementById("timePanel").style.display = "none";
    }

    // Start calendar
    renderCalendar();

  </script>

</body>
</html>
